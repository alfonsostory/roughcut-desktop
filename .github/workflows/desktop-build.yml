name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "desktop-v*"

# electron-builder attaches installers and update manifests to a draft release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: pnpm desktop:dist --mac --arm64
            artifact_name: roughcut-macos-arm64
            artifact_paths: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - os: windows-latest
            command: pnpm desktop:dist:win
            artifact_name: roughcut-windows-x64-installer
            artifact_paths: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only a pushed tag publishes to the draft GitHub release that carries
      # latest.yml for electron-updater. workflow_dispatch always builds only,
      # including when it is dispatched against a tag ref.
      - run: ${{ matrix.command }} ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: runner.os == 'Windows'
        run: pnpm desktop:test:win-installer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
