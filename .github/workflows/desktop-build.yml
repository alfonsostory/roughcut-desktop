name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "desktop-v*"

# electron-builder attaches installers and update manifests to a draft release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: pnpm desktop:dist --mac --arm64
          - os: windows-latest
            command: pnpm desktop:dist --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only a pushed tag publishes to the draft GitHub release that carries
      # latest.yml for electron-updater. workflow_dispatch always builds only,
      # including when it is dispatched against a tag ref.
      - run: ${{ matrix.command }} ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: roughcut-${{ runner.os }}-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
