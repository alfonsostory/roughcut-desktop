name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: pnpm desktop:dist --mac --arm64
          - os: macos-13
            command: pnpm desktop:dist --mac --x64
          - os: windows-latest
            command: pnpm desktop:dist --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: roughcut-${{ runner.os }}
          path: release/*
          if-no-files-found: error
